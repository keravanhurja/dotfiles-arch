[colors]
background = #1e1e2e
foreground = #cdd6f4
mauve = #cba6f7
subtext = #a6adc8
surface = #313244

[bar/main]
width = 100%
height = 26
background = ${colors.background}
foreground = ${colors.foreground}

font-0 = DejaVu Sans Mono:size=9;2

modules-left = i3
modules-right = memory date

padding-left = 1
padding-right = 1
module-margin = 1

border-size = 0
separator = |

enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
label-focused = %name%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.background}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-padding = 1

[module/memory]
type = internal/memory
interval = 5
format = RAM <label>
label = %percentage_used%%

[module/date]
type = internal/date
interval = 30
date = %H:%M
label = %date%
label-foreground = ${colors.mauve}

[settings]
screenchange-reload = true